# Merge the "flutter:" block below into your existing pubspec.yaml.
# Keep the existing "uses-material-design: true" line; add "assets" and "fonts"
# at the same indentation (two spaces under "flutter:").

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
